<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>MGT-39</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#14171f;--mu:#6b7280;--bd:#e3e6ee;--ac:#2563eb;--ok:#16a34a;--no:#dc2626;--wn:#d97706;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c25;--tx:#eef0f5;--mu:#98a0b0;--bd:#2a3040;--ac:#5b8cff;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
main{max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:22px;margin:6px 0 2px}h2{font-size:15px;margin:18px 0 8px}
.mu{color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:10px 0}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);margin:4px 0 8px}
.row{display:flex;gap:8px}.row>*{flex:1}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--ac);border:1px solid var(--bd)}
button.ok{background:var(--ok)}button.no{background:var(--no)}button:disabled{opacity:.6}
.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;color:#fff}
.t-cancel{background:var(--no)}.t-resched{background:var(--wn)}.t-extra{background:var(--ok)}.t-room{background:var(--ac)}.t-pending{background:var(--wn)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.empty{text-align:center;color:var(--mu);padding:26px 0}
</style></head><body><main id="app"><div class="empty">Loading…</div></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,addDoc,collection,onSnapshot,query,orderBy,limit} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyBlKJRh4tzKPBHYwMeVq4UqleA3y_aayG0",
  authDomain:"mgt-39.firebaseapp.com",
  projectId:"mgt-39",
  storageBucket:"mgt-39.firebasestorage.app",
  messagingSenderId:"737272189071",
  appId:"1:737272189071:web:d0d362a17d0a1efa72a0fa"
});
const auth=getAuth(app),db=getFirestore(app);
const TYPES={cancel:"Class cancelled",resched:"Rescheduled",extra:"Extra class",room:"Room change"};
const RL={student:"Student",cr:"CR",teacher:"Teacher",admin:"Admin"};
const S={me:null,tab:"feed",notices:[],reqs:[],acks:[],users:[],editId:null,unsubs:[],usersSub:false};
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=ts=>new Date(ts).toLocaleString([],{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});
const isT=()=>S.me&&(S.me.role==="teacher"||S.me.role==="admin");
const isCR=()=>S.me&&(S.me.role==="cr"||S.me.role==="admin");
const fail=e=>alert("Failed: "+(e.code||e.message||e)+"\n(Check your role / internet.)");

function login(msg){
  $("#app").innerHTML=`<h1>MGT-39</h1><p class="mu">Class routine & notice board. Teachers post changes, CRs and students see them instantly.</p>
  <div class="card"><button id="go" style="width:100%">Sign in with Google</button>${msg?`<p class="mu">${esc(msg)}</p>`:""}</div>`;
  $("#go").onclick=async()=>{const p=new GoogleAuthProvider();try{await signInWithPopup(auth,p)}catch(e){if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")signInWithRedirect(auth,p);else if(e.code!=="auth/popup-closed-by-user")login("Sign-in failed: "+(e.code||e.message))}};
}

function shell(){
  const t=S.me.role;
  $("#app").innerHTML=`<div class="top"><div><h1>MGT-39</h1><div class="mu">${esc(S.me.name)} · ${RL[t]||t}</div></div><button class="g" id="out">Sign out</button></div>
  <div class="tabs" id="tabs"></div><div id="form"></div><div id="list"></div>`;
  $("#out").onclick=()=>signOut(auth);
  renderTabs();renderForm();renderList();
}
function renderTabs(){
  const pend=S.reqs.filter(r=>r.status==="pending").length;
  const tabs=[["feed","Notices"],["reqs","Requests"+(isT()&&pend?" ●":"")]];
  if(S.me.role==="admin")tabs.push(["users","Users"]);
  $("#tabs").innerHTML=tabs.map(([k,v])=>`<button data-tab="${k}" class="${S.tab===k?"on":""}">${v}</button>`).join("");
}
function renderForm(){
  const f=$("#form");if(!f)return;
  if(S.tab==="feed"&&isT()){
    const n=S.editId?S.notices.find(x=>x.id===S.editId):null;
    f.innerHTML=`<div class="card"><b>${n?"Edit notice":"Post a notice"}</b>
    <input id="c" placeholder="Course (e.g. BCC-104)" value="${esc(n?.course)}">
    <select id="ty">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${n?.type===k?"selected":""}>${v}</option>`).join("")}</select>
    <div class="row"><input id="d" type="date" value="${esc(n?.date)}"><input id="tm" type="time" value="${esc(n?.time)}"></div>
    <input id="rm" placeholder="Room (optional)" value="${esc(n?.room)}"><textarea id="nt" rows="2" placeholder="Note (optional)">${esc(n?.note)}</textarea>
    <div class="row"><button id="post">${n?"Save changes":"Send to all"}</button>${n?`<button class="g" id="cx">Cancel</button>`:""}</div></div>`;
    $("#post").onclick=postNotice;if(n)$("#cx").onclick=()=>{S.editId=null;renderForm()};
  }else if(S.tab==="reqs"&&isCR()){
    f.innerHTML=`<div class="card"><b>Ask a teacher</b><input id="c" placeholder="Course / teacher"><textarea id="ms" rows="2" placeholder="e.g. Will tomorrow's class be held?"></textarea><button id="ask" style="width:100%">Send request</button></div>`;
    $("#ask").onclick=askReq;
  }else f.innerHTML="";
}
function renderList(){
  const l=$("#list");if(!l)return;
  if(S.tab==="feed")l.innerHTML=`<h2>Latest</h2>`+(S.notices.length?S.notices.map(nCard).join(""):`<div class="empty">No notices yet.</div>`);
  else if(S.tab==="reqs")l.innerHTML=`<h2>Requests</h2>`+(S.reqs.length?S.reqs.map(rCard).join(""):`<div class="empty">No requests.</div>`);
  else l.innerHTML=`<h2>Users (${S.users.length})</h2><p class="mu">New sign-ins start as Student. Set Teacher / CR here.</p>`+S.users.map(u=>`<div class="card"><b>${esc(u.name)}</b><div class="mu">${esc(u.email)}</div>
    <select data-role="${esc(u.id)}" ${u.id===S.me.uid?"disabled":""}>${Object.entries(RL).map(([k,v])=>`<option value="${k}" ${u.role===k?"selected":""}>${v}</option>`).join("")}</select></div>`).join("");
}
function nCard(n){
  const cnt=S.acks.filter(a=>a.n===n.id).length,mine=S.acks.some(a=>a.n===n.id&&a.uid===S.me.uid);
  const own=isT()&&(n.byId===S.me.uid||S.me.role==="admin");
  return `<div class="card"><div class="top"><span class="tag t-${esc(n.type)}">${esc(TYPES[n.type]||n.type)}</span><span class="mu">${fmt(n.ts)}</span></div>
  <div style="margin-top:6px"><b>${esc(n.course)}</b> · ${esc(n.byName)}</div>
  <div>${n.date?`📅 ${esc(n.date)} `:""}${n.time?`🕒 ${esc(n.time)} `:""}${n.room?`📍 ${esc(n.room)}`:""}</div>
  ${n.note?`<div class="mu">${esc(n.note)}</div>`:""}
  <div class="top" style="margin-top:8px"><span class="mu">✔ ${cnt} seen</span><span class="row">
  ${own?`<button class="g" data-edit="${esc(n.id)}">Edit</button><button class="g" data-del="${esc(n.id)}">Delete</button>`:""}
  ${!isT()?`<button class="${mine?"g":""}" data-seen="${esc(n.id)}" ${mine?"disabled":""}>${mine?"Seen ✔":"Mark seen"}</button>`:""}</span></div></div>`;
}
function rCard(r){
  const st=r.status||"pending",lbl={pending:"Waiting",yes:"Class will be held",no:"Class cancelled",later:"Will reschedule"}[st];
  const act=isT()&&st==="pending"?`<div class="row" style="margin-top:8px"><button class="ok" data-rep="yes" data-id="${esc(r.id)}">Yes</button><button class="no" data-rep="no" data-id="${esc(r.id)}">No</button><button class="g" data-rep="later" data-id="${esc(r.id)}">Later</button></div>`:"";
  return `<div class="card"><div class="top"><b>${esc(r.course)}</b><span class="tag ${st==="pending"?"t-pending":st==="yes"?"t-extra":"t-cancel"}">${lbl}</span></div>
  <div>${esc(r.message)}</div><div class="mu">from ${esc(r.byName)} · ${fmt(r.ts)}${r.repBy?` · answered by ${esc(r.repBy)}`:""}</div>${act}</div>`;
}

async function postNotice(){
  const c=$("#c").value.trim();if(!c){alert("Enter the course");return}
  const data={course:c,type:$("#ty").value,date:$("#d").value,time:$("#tm").value,room:$("#rm").value.trim(),note:$("#nt").value.trim()};
  try{
    if(S.editId){await updateDoc(doc(db,"notices",S.editId),data);S.editId=null}
    else await addDoc(collection(db,"notices"),{...data,byName:S.me.name,byId:S.me.uid,ts:Date.now()});
    renderForm();
  }catch(e){fail(e)}
}
async function askReq(){
  const c=$("#c").value.trim(),m=$("#ms").value.trim();if(!c||!m)return;
  try{await addDoc(collection(db,"requests"),{course:c,message:m,byName:S.me.name,byId:S.me.uid,ts:Date.now(),status:"pending"});$("#c").value=$("#ms").value=""}catch(e){fail(e)}
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b||!S.me)return;const d=b.dataset;
  try{
    if(d.tab){S.tab=d.tab;S.editId=null;renderTabs();renderForm();renderList()}
    else if(d.edit){S.editId=d.edit;renderForm();scrollTo(0,0)}
    else if(d.del){if(confirm("Delete this notice?"))await deleteDoc(doc(db,"notices",d.del))}
    else if(d.seen){await setDoc(doc(db,"acks",d.seen+"_"+S.me.uid),{n:d.seen,uid:S.me.uid,name:S.me.name,ts:Date.now()})}
    else if(d.rep){await updateDoc(doc(db,"requests",d.id),{status:d.rep,repBy:S.me.name})}
  }catch(er){fail(er)}
});
document.addEventListener("change",async e=>{
  const id=e.target.dataset?.role;if(!id)return;
  try{await updateDoc(doc(db,"users",id),{role:e.target.value})}catch(er){fail(er)}
});

function stop(){S.unsubs.forEach(f=>f());S.unsubs=[];S.usersSub=false;S.me=null}
onAuthStateChanged(auth,async u=>{
  stop();
  if(!u){login();return}
  try{
    const ref=doc(db,"users",u.uid);
    if(!(await getDoc(ref)).exists())await setDoc(ref,{name:u.displayName||u.email,email:u.email,role:"student",ts:Date.now()});
    const on=(q,fn)=>S.unsubs.push(onSnapshot(q,fn,e=>console.error(e)));
    let first=true;
    on(ref,s=>{
      const was=S.me?.role;S.me={uid:u.uid,...s.data()};
      if(S.me.role==="admin"&&!S.usersSub){S.usersSub=true;on(query(collection(db,"users"),limit(300)),x=>{S.users=x.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.name||"").localeCompare(b.name||""));if(S.tab==="users")renderList()})}
      if(first||was!==S.me.role){first=false;shell()}
    });
    on(query(collection(db,"notices"),orderBy("ts","desc"),limit(60)),x=>{S.notices=x.docs.map(d=>({id:d.id,...d.data()}));if(S.me)renderList()});
    on(query(collection(db,"requests"),orderBy("ts","desc"),limit(60)),x=>{S.reqs=x.docs.map(d=>({id:d.id,...d.data()}));if(S.me){renderTabs();renderList()}});
    on(collection(db,"acks"),x=>{S.acks=x.docs.map(d=>d.data());if(S.me)renderList()});
  }catch(e){login("Error: "+(e.code||e.message))}
});
</script></body></html>
