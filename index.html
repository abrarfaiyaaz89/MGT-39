<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<title>MGT-39</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#14213d;--mu:#6b7280;--line:#e7e2d7;--pri:#14213d;--pritx:#fff;--gold:#b08a3e;--soft:#f8f6f0;--sh:0 1px 2px rgba(20,33,61,.06),0 10px 26px rgba(20,33,61,.07);--cancel:#b3261e;--resched:#b7791f;--extra:#1f7a4d;--room:#2b5fb4;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0d1320;--card:#151d2e;--ink:#eceff5;--mu:#97a1b5;--line:#253049;--pri:#d3b06a;--pritx:#101626;--gold:#d3b06a;--soft:#1a2438;--sh:0 1px 2px rgba(0,0,0,.4);--cancel:#ef7b73;--resched:#e0aa4f;--extra:#4cc38a;--room:#7aa5f0;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.serif{font-family:"Playfair Display",Georgia,"Times New Roman",serif}
header.hd{background:linear-gradient(135deg,#14213d 0%,#233a6b 100%);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 22px;border-radius:0 0 22px 22px}
.hd .row1{display:flex;justify-content:space-between;align-items:center;max-width:600px;margin:0 auto}
.hd h1{font-size:26px;margin:0;letter-spacing:.5px}
.hd .sub{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#d8bd85;margin-top:2px}
.hd .who{max-width:600px;margin:14px auto 0;font-size:13px;color:#dfe5f3}
.av{width:38px;height:38px;border-radius:50%;background:#d8bd85;color:#14213d;display:flex;align-items:center;justify-content:center;font-weight:700}
main{max-width:600px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:600px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 18px 40px}
h2{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mu);margin:22px 2px 10px;font-weight:600}
.mu{color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
label.l{display:block;font-size:12px;font-weight:600;color:var(--mu);margin:8px 2px 2px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--soft);margin:3px 0 6px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
.row{display:flex;gap:8px}.row>*{flex:1}
button{border:0;border-radius:11px;padding:11px 16px;background:var(--pri);color:var(--pritx);font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.ok{background:var(--extra);color:#fff}button.no{background:var(--cancel);color:#fff}button:disabled{opacity:.55}
button.sm{padding:7px 11px;font-size:13px}
nav.bn{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.bn .in{display:flex;width:100%;max-width:600px}
nav.bn button{flex:1;background:none;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;padding:6px 4px;position:relative;border-radius:10px}
nav.bn button.on{color:var(--pri)}nav.bn svg{width:23px;height:23px}
.dot{position:absolute;top:2px;right:28%;background:var(--cancel);color:#fff;border-radius:99px;font-size:10px;min-width:16px;height:16px;line-height:16px;padding:0 4px}
.n{border-left:4px solid var(--c,var(--room))}
.n-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);padding:3px 9px;border-radius:99px}
.when{font-size:12px;color:var(--mu)}
.n h3{margin:8px 0 6px;font-size:19px;font-family:"Playfair Display",Georgia,serif}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0;padding:10px;background:var(--soft);border-radius:12px}
.facts b{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--mu);font-weight:600}
.facts span{font-weight:600;font-size:14px}
.note{color:var(--ink);opacity:.85;margin:6px 0}
.mn{color:var(--gold);font-weight:700}
.by{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.by .av{width:32px;height:32px;font-size:13px}.by .nm{font-weight:600;line-height:1.2}.by .mu{font-size:12px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--soft);border:1px solid var(--line);color:var(--mu)}
.pill.me{color:var(--gold);border-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 8px}
.chipb{padding:5px 10px;border-radius:99px;background:var(--soft);border:1px solid var(--line);color:var(--ink);font-size:13px}
.chipb small{color:var(--mu);margin-left:5px}
.empty{text-align:center;color:var(--mu);padding:36px 10px}.empty b{display:block;color:var(--ink);font-family:"Playfair Display",Georgia,serif;font-size:18px;margin-bottom:4px}
.hero{text-align:center;padding-top:8vh}.hero h1{font-size:40px;margin:8px 0}.hero p{color:var(--mu)}
.logo{width:64px;height:64px;margin:0 auto;border-radius:18px;background:linear-gradient(135deg,#14213d,#233a6b);color:#d8bd85;display:flex;align-items:center;justify-content:center;font-size:28px}
.rx{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
button.rb{padding:4px 11px;border-radius:99px;background:var(--soft);border:1px solid var(--line);color:var(--ink);font-size:14px;font-weight:500}
button.rb.mine{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,transparent)}
button.rb small{margin-left:4px;color:var(--mu);font-weight:700}
.pick{margin-top:8px;padding:8px;background:var(--soft);border-radius:12px;display:flex;flex-wrap:wrap;gap:2px;border:1px solid var(--line)}
.pick button{background:none;font-size:24px;padding:4px 7px;border-radius:9px;color:inherit}
.ov{position:fixed;inset:0;background:rgba(10,15,30,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:360px;width:100%;box-shadow:var(--sh)}
.dlg p{margin:0 0 16px;font-weight:600;line-height:1.4}
.lg{text-align:center;margin:0 auto 8px}.lg img{width:170px;max-width:60%;height:auto;opacity:.92}
.hl{height:42px;width:auto;opacity:.92;display:block}
.upd{border-left:4px solid var(--c)}.upd .mu{font-size:12px}

const isAdmin=()=>role()==="admin",isT=()=>["teacher","admin"].includes(role()),isCR=()=>["cr","admin"].includes(role()),isP=()=>["teacher","cr","admin"].includes(role());

const stat=u=>u.status||"approved";
const prof=id=>S.profs.find(p=>p.id===id);
const teachers=()=>S.profs.filter(p=>p.role==="teacher"||p.role==="admin").sort((a,b)=>a.nick.localeCompare(b.nick));
const on=(list,q,fn)=>list.push(onSnapshot(q,fn,e=>console.warn("listen",e.code)));
function mentionsOf(text){const out=new Set();(String(text).match(/@([a-z0-9_]{3,15})/gi)||[]).forEach(m=>{const p=S.profs.find(x=>x.nick===m.slice(1).toLowerCase()&&(x.role==="teacher"||x.role==="admin"));if(p)out.add(p.id)});return [...out]}

function screenLogin(msg){
  $("#app").innerHTML=`<div class="wrap hero">${LG}<p>Class routine &amp; notice board<br>Department of Management · University of Chittagong</p>
  <div class="card"><button id="go" style="width:100%">Continue with Google</button><p class="mu" style="margin:10px 0 0">Use your Gmail. New members need admin approval.</p>${msg?`<p class="mu" style="color:var(--cancel)">${esc(msg)}</p>`:""}</div></div>`;
  $("#go").onclick=async()=>{const p=new GoogleAuthProvider();try{await signInWithPopup(auth,p)}catch(e){if(["auth/popup-blocked","auth/operation-not-supported-in-this-environment"].includes(e.code))signInWithRedirect(auth,p);else if(e.code!=="auth/popup-closed-by-user")screenLogin("Sign-in failed: "+(e.code||e.message))}};
}
function screenRegister(){
  const leg=!!S.me;
  $("#app").innerHTML=`<div class="wrap">${LG}<h1 class="serif" style="text-align:center">${leg?"Complete your profile":"Join MGT-39"}</h1>
  <p class="mu" style="text-align:center">Signed in as ${esc(S.user.email)}</p>
  <div class="card"><label class="l">Full name</label><input id="rn" value="${esc(S.me?.name||S.user.displayName||"")}" placeholder="e.g. Abrar Faiyaaz">

  ${leg?"":`<label class="l">I am a</label><select id="rr"><option value="student">Student</option><option value="teacher">Teacher</option></select>
  <div id="sidw"><label class="l">Student ID (optional, helps the admin identify you)</label><input id="rs" inputmode="numeric" placeholder="e.g. 2603021022"></div>`}

  <button class="g" id="out" style="width:100%;margin-top:8px">Sign out</button></div></div>`;

}
function screenWait(){

  <div class="card" style="text-align:left"><b>${esc(S.me.name)}</b><div class="mu">${esc(S.me.email)}</div><div class="mu">Requested role: ${RL[S.me.reqRole]||"Student"}${S.me.sid?" · ID "+esc(S.me.sid):""}</div></div>

}

function pendingCount(){return S.users.filter(u=>stat(u)==="pending").length}
function renderNav(){
  const tabs=[["feed","Notices"]];
  if(isP()||isT())tabs.push(["reqs","Requests"]);
  if(isAdmin())tabs.push(["people","People"]);
  tabs.push(["me","Me"]);
  const pend=S.reqs.filter(r=>r.status==="pending").length;
  $("#nav").innerHTML=tabs.map(([k,v])=>{const n=k==="people"?pendingCount():k==="reqs"&&isT()?pend:0;
    return `<button data-tab="${k}" class="${S.tab===k?"on":""}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>${v}${n?`<span class="dot">${n}</span>`:""}</button>`}).join("");
}
function chips(target){return `<div class="mu" style="margin:0 2px 4px">Tap to mention a teacher:</div><div class="chips">${teachers().map(p=>`<button type="button" class="chipb" data-ins="@${esc(p.nick)}" data-t="${target}">@${esc(p.nick)}<small>${esc(p.name)}</small></button>`).join("")||'<span class="mu">No teachers yet.</span>'}</div>`}
function renderForm(){
  const f=$("#form");if(!f)return;

    const n=S.editId?S.notices.find(x=>x.id===S.editId):null;
    if(!n&&!S.formOpen){f.innerHTML=`<button id="open" style="width:100%">＋ New notice</button>`;$("#open").onclick=()=>{S.formOpen=true;renderForm()};return}
    f.innerHTML=`<div class="card"><b class="serif" style="font-size:18px">${n?"Edit notice":"New notice"}</b>
    <label class="l">Course</label><input id="c" placeholder="e.g. BCC-104" value="${esc(n?.course)}">
    <label class="l">Type</label><select id="ty">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${n?.type===k?"selected":""}>${v}</option>`).join("")}</select>
    <div class="row"><div><label class="l">Date</label><input id="d" type="date" value="${esc(n?.date)}"></div><div><label class="l">Time</label><input id="tm" type="time" value="${esc(n?.time)}"></div></div>

    <label class="l">Note (optional)</label><textarea id="nt" rows="2">${esc(n?.note)}</textarea>${chips("nt")}
    <div class="mu" style="margin-bottom:8px">${isT()?"This notice goes to everyone.":"Students get this notice. A teacher is notified only if you @mention them."}</div>
    <div class="row"><button id="post">${n?"Save changes":"Publish"}</button><button class="g" id="cx">Cancel</button></div></div>`;
    $("#post").onclick=postNotice;$("#cx").onclick=()=>{S.editId=null;S.formOpen=false;renderForm()};
  }else if(S.tab==="reqs"&&isCR()){
    if(!S.formOpen){f.innerHTML=`<button id="open" style="width:100%">＋ Ask a teacher</button>`;$("#open").onclick=()=>{S.formOpen=true;renderForm()};return}
    f.innerHTML=`<div class="card"><b class="serif" style="font-size:18px">Ask a teacher</b>
    <label class="l">Course</label><input id="c" placeholder="e.g. BCC-104">
    <label class="l">Message (mention at least one teacher)</label><textarea id="ms" rows="2" placeholder="@nickname Sir, will tomorrow's class be held?"></textarea>${chips("ms")}
    <div class="row"><button id="ask">Send</button><button class="g" id="cx">Cancel</button></div></div>`;
    $("#ask").onclick=askReq;$("#cx").onclick=()=>{S.formOpen=false;renderForm()};

  }else f.innerHTML="";
}

function nCard(n){
  const cnt=S.acks.filter(a=>a.n===n.id).length,mine=S.acks.some(a=>a.n===n.id&&a.uid===S.user.uid);

  ${n.note?`<div class="note">${rich(n.note)}</div>`:""}${byBlock(n)}${rxBar(n)}
  <div class="foot"><span class="pill ${ment?"me":""}">${ment?"Mentions you":"✔ "+cnt+" seen"}${tos.length&&!ment?" · to "+tos.map(t=>"@"+esc(t)).join(" "):""}</span><span class="row">
  ${own?`<button class="g sm" data-edit="${esc(n.id)}">Edit</button><button class="g sm" data-del="${esc(n.id)}">Delete</button>`:""}
  ${!isT()&&n.byId!==S.user.uid?`<button class="sm ${mine?"g":""}" data-seen="${esc(n.id)}" ${mine?"disabled":""}>${mine?"Seen ✔":"Mark seen"}</button>`:""}</span></div></article>`;
}
const QUICK=["👍","👎","❤️","😂","😮","😢","🙏"];
const MORE=["🔥","🎉","👏","💯","✅","❌","😍","🥰","😎","🤔","😅","😭","😡","🤝","💪","🙌","👌","✌️","🤞","😴","🤯","🥳","😇","🙄","😬","🤗","👀","💔","💖","⭐","🏆","📚","📝","⏰","😊","😁","😆","🥲","😤","🤩"];
function firstEmoji(t){t=(t||"").trim();if(!t)return "";let g;try{g=[...new Intl.Segmenter(undefined,{granularity:"grapheme"}).segment(t)][0].segment}catch(e){g=[...t][0]}return /\p{Extended_Pictographic}/u.test(g)?g:""}
function rxBar(n){
  const rs=S.reacts.filter(r=>r.n===n.id),mine=rs.find(r=>r.uid===S.user.uid),g={};
  rs.forEach(r=>(g[r.e]=g[r.e]||[]).push(r));
  const chips=Object.entries(g).sort((a,b)=>b[1].length-a[1].length).map(([e,a])=>`<button class="rb ${mine?.e===e?"mine":""}" data-react="${esc(e)}" data-id="${esc(n.id)}" title="${esc(a.map(x=>x.name).join(", "))}">${esc(e)}<small>${a.length}</small></button>`).join("");
  const pick=S.pickId===n.id?`<div class="pick">${QUICK.map(e=>`<button data-react="${e}" data-id="${esc(n.id)}">${e}</button>`).join("")}<button data-more="1">➕</button>${S.more?`<div style="width:100%;display:flex;flex-wrap:wrap;gap:2px">${MORE.map(e=>`<button data-react="${e}" data-id="${esc(n.id)}">${e}</button>`).join("")}</div><div class="row" style="width:100%;margin-top:6px"><input id="ce" placeholder="Type any emoji"><button class="sm" style="flex:0 0 auto;font-size:14px" data-custom="${esc(n.id)}">React</button></div>`:""}</div>`:"";
  return `<div class="rx">${chips}<button class="rb" data-pick="${esc(n.id)}">${mine?"Change":"☺ React"}</button></div>${pick}`;
}
async function toggleReact(nid,e){
  const id=nid+"_"+S.user.uid,ex=S.reacts.find(r=>r.id===id);S.pickId=null;S.more=false;
  if(ex&&ex.e===e)await deleteDoc(doc(db,"reactions",id));
  else await setDoc(doc(db,"reactions",id),{n:nid,uid:S.user.uid,e,name:S.prof?.nick||S.me.name,ts:Date.now()});
  renderList();
}
function uCardPub(u){
  const L={yes:"Class will be held",no:"Class cancelled",later:"Will reschedule"},col=u.status==="yes"?"extra":u.status==="no"?"cancel":"resched",at=ms(u.answeredAt),left=Math.max(1,Math.ceil((at+DAY-Date.now())/36e5));
  return `<article class="card n upd" style="--c:var(--${col})"><div class="n-top"><span class="chip">${L[u.status]||u.status}</span><span class="when">${fmtTs(at)}</span></div>
  <h3>${esc(u.course)}</h3><div class="note">${rich(u.message)}</div>
  <div class="mu">Asked by ${esc(u.askedBy)} (@${esc(u.askedNick)})</div><div class="mu">Answered by ${esc(u.repName)} (@${esc(u.repBy)}) · visible ~${left}h more</div></article>`;
}
function rCard(r){
  const st=r.status||"pending",lbl={pending:"Waiting",yes:"Class will be held",no:"Class cancelled",later:"Will reschedule"}[st],col=st==="pending"?"resched":st==="yes"?"extra":"cancel";
  const to=(r.mentions||[]).map((id,i)=>"@"+esc(prof(id)?.nick||r.mentionNicks?.[i]||"unknown")).join(" "),at=ms(r.answeredAt||r.ts);
  const can=isT()&&st==="pending"&&(isAdmin()||(r.mentions||[]).includes(S.user.uid));
  return `<article class="card n" style="--c:var(--${col})"><div class="n-top"><span class="chip">${lbl}</span><span class="when">${fmtTs(r.ts)}</span></div>
  <h3>${esc(r.course)}</h3><div class="note">${rich(r.message)}</div><div class="mu">To ${to}</div>${byBlock(r)}
  ${r.repBy?`<div class="mu" style="margin-top:6px">Asked ${fmtTs(r.ts)} · Answered by @${esc(r.repBy)}${r.answeredAt?" · "+fmtTs(at):""}</div>${isAdmin()?`<button class="g sm" style="margin-top:8px" data-proof="${esc(r.id)}">Copy proof</button>`:""}`:""}
  ${can?`<div class="row" style="margin-top:10px"><button class="ok" data-rep="yes" data-id="${esc(r.id)}">Yes</button><button class="no" data-rep="no" data-id="${esc(r.id)}">No</button><button class="g" data-rep="later" data-id="${esc(r.id)}">Later</button></div>`:""}</article>`;
}
function uCard(u){
  const p=prof(u.id),st=stat(u),self=u.id===S.user.uid,nm=p?.name||u.name;
  const roleSel=(id,val,opts)=>`<select id="${id}" data-role="${esc(u.id)}" ${self?"disabled":""}>${opts.map(k=>`<option value="${k}" ${val===k?"selected":""}>${RL[k]}</option>`).join("")}</select>`;
  let act="";
  if(st==="pending")act=`<label class="l">Approve as</label>${roleSel("ar_"+u.id,u.reqRole||"student",["student","teacher","cr"])}<div class="row"><button class="ok sm" data-approve="${esc(u.id)}">Approve</button><button class="no sm" data-reject="${esc(u.id)}">Reject</button></div>`;
  else if(st==="approved")act=`${roleSel("rs_"+u.id,u.role,["student","cr","teacher","admin"])}${self?"":`<div class="row"><button class="g sm" data-block="${esc(u.id)}">Block</button><button class="no sm" data-remove="${esc(u.id)}">Remove</button></div>`}`;
  else act=`<div class="row"><button class="g sm" data-unblock="${esc(u.id)}">Unblock</button><button class="no sm" data-remove="${esc(u.id)}">Remove</button></div>`;
  return `<div class="card"><div class="top" style="display:flex;justify-content:space-between;gap:8px"><div><b>${esc(nm)}</b> <span class="mn">@${esc(p?.nick||"—")}</span></div><span class="pill">${st==="approved"?RL[u.role]:st}</span></div>
  <div class="mu">${esc(u.email)}${u.sid?" · ID "+esc(u.sid):""}</div><div style="margin:8px 0 2px"><button class="g sm" data-editu="${esc(u.id)}">Edit name / nickname</button></div>${act}</div>`;
}
function renderList(){
  const l=$("#list");if(!l)return;
  const live=S.updates.filter(u=>Date.now()-ms(u.answeredAt)<DAY);
  if(S.tab==="feed")l.innerHTML=(live.length?`<h2>Class updates · last 24 hours</h2>`+live.map(uCardPub).join(""):"")+`<h2>Latest notices</h2>`+(S.notices.length?S.notices.map(nCard).join(""):empty("No notices yet","New class updates will appear here."));
  else if(S.tab==="reqs"){const rs=[...S.reqs].sort((a,b)=>b.ts-a.ts);l.innerHTML=`<h2>Requests</h2>`+(rs.length?rs.map(rCard).join(""):empty("No requests","Requests that mention you will appear here."))}
  else if(S.tab==="people"){
    const q=S.q.toLowerCase(),us=S.users.filter(u=>((u.name||"")+" "+(prof(u.id)?.nick||"")+" "+(u.email||"")+" "+(u.sid||"")).toLowerCase().includes(q));
    const grp=(t,f)=>{const a=us.filter(u=>stat(u)===f);return a.length?`<h2>${t} (${a.length})</h2>`+a.map(uCard).join(""):""};
    const nb=S.users.filter(u=>stat(u)==="rejected").length,seg=`<div class="row" style="margin-bottom:6px"><button class="${S.ptab==="active"?"":"g"}" data-ptab="active">Active</button><button class="${S.ptab==="blocked"?"":"g"}" data-ptab="blocked">Blocked (${nb})</button></div>`;
    if(S.ptab==="blocked"){const a=us.filter(u=>stat(u)==="rejected");l.innerHTML=seg+`<h2>Block list (${a.length})</h2>`+(a.length?a.map(uCard).join(""):empty("No blocked users","People you block or reject appear here."))}
    else l.innerHTML=seg+(grp("Waiting for approval","pending")+grp("Members","approved")||empty("No users",""));
  }else l.innerHTML=`<div class="card"><b class="serif" style="font-size:20px">${esc(S.me.name)}</b><div class="mu">@${esc(S.prof?.nick||"")} · ${RL[role()]}</div><div class="mu">${esc(S.me.email)}</div>${S.me.sid?`<div class="mu">ID ${esc(S.me.sid)}</div>`:""}
  <button class="g" id="out2" style="margin-top:12px;width:100%">Sign out</button></div><div class="card mu">Push notifications will arrive in the next update. For now, open the app to see new notices.</div>`;
  $("#out2")&&($("#out2").onclick=()=>signOut(auth));
}

/* ---------- actions ---------- */
async function submitReg(){
  const name=$("#rn").value.trim(),nick=$("#rk").value.trim().toLowerCase().replace(/^@/,"");
  if(name.length<3)return alert("Enter your full name");
  if(!/^[a-z0-9_]{3,15}$/.test(nick))return alert("Nickname: 3–15 letters, numbers or underscore. No spaces.");
  const uid=S.user.uid,b=writeBatch(db);
  if(S.me)b.set(doc(db,"profiles",uid),{name,nick,role:S.me.role});
  else{const rr=$("#rr").value,sid=rr==="student"?($("#rs").value.trim()):"";
    b.set(doc(db,"users",uid),{name,email:S.user.email,sid,role:"student",status:"pending",reqRole:rr,ts:Date.now()});
    b.set(doc(db,"profiles",uid),{name,nick,role:"student"})}
  b.set(doc(db,"nicks",nick),{uid});
  $("#sub").disabled=true;
  try{await b.commit()}catch(e){$("#sub").disabled=false;alert(e.code==="permission-denied"?"That nickname is already taken. Try another.":"Failed: "+(e.code||e.message))}
}
async function postNotice(){
  const c=$("#c").value.trim();if(!c)return alert("Enter the course");
  const note=$("#nt").value.trim(),data={course:c,type:$("#ty").value,date:$("#d").value,time:$("#tm").value,room:$("#rm").value.trim(),note,mentions:mentionsOf(note)};
  try{
    if(S.editId)await updateDoc(doc(db,"notices",S.editId),data);
    else await addDoc(collection(db,"notices"),{...data,byId:S.user.uid,byName:S.me.name,byNick:S.prof.nick,byRole:role(),push:isT()?"all":"students",ts:Date.now()});
    S.editId=null;S.formOpen=false;renderForm();
  }catch(e){fail(e)}
}
async function askReq(){
  const c=$("#c").value.trim(),m=$("#ms").value.trim(),men=mentionsOf(m);
  if(!c||!m)return alert("Fill in course and message");
  if(!men.length)return alert("Mention at least one teacher, e.g. tap a name below the message.");
  try{await addDoc(collection(db,"requests"),{course:c,message:m,mentions:men,mentionNicks:men.map(id=>prof(id)?.nick||""),byId:S.user.uid,byName:S.me.name,byNick:S.prof.nick,byRole:role(),status:"pending",ts:Date.now()});S.formOpen=false;renderForm()}catch(e){fail(e)}
}
const nameOf=id=>prof(id)?.name||S.users.find(u=>u.id===id)?.name||"this user";
async function removeUser(id){
  const p=prof(id),bb=writeBatch(db);
  bb.delete(doc(db,"users",id));bb.delete(doc(db,"profiles",id));if(p?.nick)bb.delete(doc(db,"nicks",p.nick));
  S.acks.filter(a=>a.uid===id).forEach(a=>bb.delete(doc(db,"acks",a.n+"_"+id)));
  S.reacts.filter(r=>r.uid===id).forEach(r=>bb.delete(doc(db,"reactions",r.id)));
  await bb.commit();
}
async function setRole(uid,r,extra){const b=writeBatch(db);b.update(doc(db,"users",uid),{role:r,...extra});b.update(doc(db,"profiles",uid),{role:r});await b.commit()}
document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b||S.stage!=="app")return;const d=b.dataset;
  try{
    if(d.tab){S.tab=d.tab;S.editId=null;S.formOpen=false;renderNav();renderForm();renderList();scrollTo(0,0)}
    else if(d.ins){const t=$("#"+d.t);t.value+=(t.value&&!/\s$/.test(t.value)?" ":"")+d.ins+" ";t.focus()}
    else if(d.edit){S.editId=d.edit;renderForm();scrollTo(0,0)}
    else if(d.del){if(confirm("Delete this notice?"))await deleteDoc(doc(db,"notices",d.del))}
    else if(d.seen)await setDoc(doc(db,"acks",d.seen+"_"+S.user.uid),{n:d.seen,uid:S.user.uid,name:S.me.name,ts:Date.now()});
    else if(d.rep){const r=S.reqs.find(x=>x.id===d.id);if(!r)return;const bb=writeBatch(db),at=serverTimestamp();
      bb.update(doc(db,"requests",d.id),{status:d.rep,repBy:S.prof.nick,repById:S.user.uid,answeredAt:at});
      bb.set(doc(db,"updates",d.id),{course:r.course,message:r.message,status:d.rep,askedBy:r.byName,askedNick:r.byNick||"",askedRole:r.byRole||"",askedAt:r.ts,repName:S.me.name,repBy:S.prof.nick,repById:S.user.uid,answeredAt:at});
      await bb.commit()}
    else if(d.proof){const r=S.reqs.find(x=>x.id===d.proof);if(!r)return;const L={yes:"Class will be held",no:"Class cancelled",later:"Will reschedule"};
      const t=`MGT-39 proof\nCourse: ${r.course}\nRequest: ${r.message}\nAsked by: ${r.byName} (@${r.byNick||""}, ${RL[r.byRole]||""}) on ${new Date(r.ts).toLocaleString()}\nAnswer: ${L[r.status]||r.status}\nAnswered by: @${r.repBy||""} on ${r.answeredAt?new Date(ms(r.answeredAt)).toLocaleString():"-"}\nRef: ${r.id}`;
      try{await navigator.clipboard.writeText(t);alert("Proof copied")}catch(e){prompt("Copy this proof:",t)}}
    else if(d.approve){const r=$("#ar_"+d.approve)?.value;await setRole(d.approve,r||S.users.find(u=>u.id===d.approve)?.role||"student",{status:"approved"})}
    else if(d.react)await toggleReact(d.id,d.react);
    else if(d.pick){S.pickId=S.pickId===d.pick?null:d.pick;S.more=false;renderList()}
    else if(d.more){S.more=!S.more;renderList()}
    else if(d.custom){const v=firstEmoji($("#ce").value);if(!v)return alert("Type an emoji first");await toggleReact(d.custom,v)}
    else if(d.editu&&isAdmin()){
      const u=S.users.find(x=>x.id===d.editu),p=prof(d.editu);
      const nm=prompt("Full name",p?.name||u?.name||"");if(nm===null)return;
      const nk=prompt("Nickname (3-15: letters, numbers, _)",p?.nick||"");if(nk===null)return;
      const name=nm.trim(),nick=nk.trim().toLowerCase().replace(/^@/,"");
      if(name.length<3)return alert("Name is too short");
      if(!/^[a-z0-9_]{3,15}$/.test(nick))return alert("Invalid nickname");
      if(S.profs.some(x=>x.nick===nick&&x.id!==d.editu))return alert("That nickname is already used");
      const bb=writeBatch(db);
      bb.set(doc(db,"profiles",d.editu),{name,nick,role:u?.role||"student"},{merge:true});
      bb.update(doc(db,"users",d.editu),{name});
      if(p?.nick&&p.nick!==nick)bb.delete(doc(db,"nicks",p.nick));
      bb.set(doc(db,"nicks",nick),{uid:d.editu});
      await bb.commit();
    }
    else if(d.ptab){S.ptab=d.ptab;renderList()}
    else if(d.reject){if(await ask("Reject this request? The person will go to the Block list."))await updateDoc(doc(db,"users",d.reject),{status:"rejected"})}
    else if(d.block){const nm=nameOf(d.block);if(await ask(`Block ${nm}?`)&&await ask(`${nm} will lose access to all notices. Block now?`))await updateDoc(doc(db,"users",d.block),{status:"rejected"})}
    else if(d.unblock){const nm=nameOf(d.unblock),u=S.users.find(x=>x.id===d.unblock);
      if(await ask(`Unblock ${nm}? They will need your approval again, like a new login.`)){const bb=writeBatch(db);
        bb.update(doc(db,"users",d.unblock),{status:"pending",role:"student",reqRole:u?.role==="teacher"?"teacher":"student"});
        if(prof(d.unblock))bb.update(doc(db,"profiles",d.unblock),{role:"student"});await bb.commit()}}
    else if(d.remove){const nm=nameOf(d.remove);if(await ask(`Are you sure you want to remove ${nm}?`)&&await ask(`${nm} will be removed and must request approval again like a new user. Remove now?`))await removeUser(d.remove)}
  }catch(er){fail(er)}
});
document.addEventListener("change",async e=>{
  const id=e.target.dataset?.role;if(!id||!e.target.id.startsWith("rs_"))return;
  try{await setRole(id,e.target.value,{})}catch(er){fail(er)}
});

/* ---------- state / routing ---------- */
function stopAll(){[...S.unsubs,...S.dataUnsubs,...S.reqUnsub].forEach(f=>f());Object.assign(S,{unsubs:[],dataUnsubs:[],reqUnsub:[],started:false,usersSub:false,ptab:"active",me:null,meLoaded:false,profs:[],profsLoaded:false,prof:null,notices:[],reqs:[],acks:[],reacts:[],updates:[],pickId:null,more:false,users:[],reqRole:null,tab:"feed",formOpen:false,editId:null,shellKey:""})}
function stopData(){[...S.dataUnsubs,...S.reqUnsub].forEach(f=>f());Object.assign(S,{dataUnsubs:[],reqUnsub:[],started:false,usersSub:false,profs:[],profsLoaded:false,prof:null,notices:[],reqs:[],acks:[],reacts:[],updates:[],users:[],reqRole:null,shellKey:""})}
function subReqs(){
  S.reqUnsub.forEach(f=>f());S.reqUnsub=[];S.reqRole=role();S.reqs=[];const c=collection(db,"requests"),u=S.user.uid;
  const cb=x=>{S.reqs=x.docs.map(d=>({id:d.id,...d.data()}));if(S.stage==="app"){renderNav();if(S.tab==="reqs")renderList()}};
  if(isAdmin())on(S.reqUnsub,query(c,orderBy("ts","desc"),limit(300)),cb);
  else if(role()==="teacher")on(S.reqUnsub,query(c,where("mentions","array-contains",u),limit(80)),cb);
  else if(role()==="cr")on(S.reqUnsub,query(c,where("byId","==",u),limit(80)),cb);
}
function startApp(){
  if(!S.started){S.started=true;
    on(S.dataUnsubs,collection(db,"profiles"),x=>{S.profs=x.docs.map(d=>({id:d.id,...d.data()}));S.profsLoaded=true;S.prof=prof(S.user.uid)||null;route()});
    on(S.dataUnsubs,query(collection(db,"notices"),orderBy("ts","desc"),limit(60)),x=>{S.notices=x.docs.map(d=>({id:d.id,...d.data()}));refresh()});
    on(S.dataUnsubs,collection(db,"acks"),x=>{S.acks=x.docs.map(d=>d.data());refresh()});
    on(S.dataUnsubs,query(collection(db,"updates"),orderBy("answeredAt","desc"),limit(50)),x=>{S.updates=x.docs.map(d=>({id:d.id,...d.data()}));
      if(isAdmin())S.updates.filter(u=>Date.now()-ms(u.answeredAt)>DAY+36e5).forEach(u=>deleteDoc(doc(db,"updates",u.id)).catch(()=>{}));refresh()});
    on(S.dataUnsubs,query(collection(db,"reactions"),limit(5000)),x=>{S.reacts=x.docs.map(d=>({id:d.id,...d.data()}));refresh()});
  }
  if(S.reqRole!==role())subReqs();
  if(isAdmin()&&!S.usersSub){S.usersSub=true;on(S.dataUnsubs,query(collection(db,"users"),limit(400)),x=>{S.users=x.docs.map(d=>({id:d.id,...d.data()}));refresh()})}
}
function refresh(){if(S.stage!=="app")return;renderNav();if(S.tab!=="me")renderList()}
function route(){
  let st;
  if(!S.user)st="login";
  else if(!S.meLoaded)st="load";
  else if(!S.me)st="register";
  else{const s=stat(S.me);
    if(s==="pending"||s==="rejected")st="wait";
    else{startApp();st=!S.profsLoaded?"load":!S.prof?"register":"app"}}
  if(S.started&&(!S.me||st==="wait"))stopData();
  const key=st+"|"+(S.me?stat(S.me)+role():"")+"|"+(S.prof?.nick||"");
  if(st==="app"&&S.stage==="app"){if(S.shellKey!==role()+"|"+(S.prof?.nick||"")){if(S.reqRole!==role())subReqs();shell()}else refresh();return}
  S.stage=st;
  if(st==="login")screenLogin();else if(st==="register")screenRegister();else if(st==="wait")screenWait();else if(st==="app")shell();else $("#app").innerHTML='<div class="empty">Loading…</div>';
}
setInterval(()=>{if(S.stage==="app"&&S.tab==="feed")renderList()},60000);
onAuthStateChanged(auth,u=>{
  stopAll();S.user=u;
  if(!u){S.stage="";route();return}
  S.stage="load";route();
  on(S.unsubs,doc(db,"users",u.uid),s=>{S.meLoaded=true;S.me=s.exists()?{uid:u.uid,...s.data()}:null;route()});
});
</script></body></html>
